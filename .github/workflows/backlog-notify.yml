name: Backlog課題 手動通知

# 定期実行はVercel Cron（vercel.json）に移行済み。ここは手動実行用
on:
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Backlog課題をSlackに通知
        run: |
          curl -X POST https://mastra-practice.vercel.app/api/backlog-notify \
            -H "Content-Type: application/json" \
            -d '{
              "daysThresholdMin": -4,
              "daysThresholdMax": 1,
              "skipWeekendHoliday": true
            }'
